<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f5fa" />
    <title>RAG Agent 工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l2.3 5.8 5.8 2.3-5.8 2.3-2.3 5.8-2.3-5.8-5.8-2.3 5.8-2.3z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l2.1 5.4L19.5 10.5l-5.4 2.1L12 18l-2.1-5.4L4.5 10.5l5.4-2.1z" />
            </svg>
          </div>
          <div>
            <h1>RAG Agent</h1>
            <p>本地知识库问答工作台</p>
          </div>
        </div>

        <section class="panel model-panel" aria-labelledby="modelTitle">
          <div class="panel-title">
            <div>
              <span id="modelTitle">模型连接</span>
              <small id="providerLabel">正在读取配置</small>
            </div>
            <span id="providerState" class="state-dot" title="连接状态"></span>
          </div>

          <label class="field-label" for="providerSelect">供应商</label>
          <select id="providerSelect"></select>

          <label class="field-label" for="apiKeyInput">API Key</label>
          <input
            id="apiKeyInput"
            class="field-input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="正在读取配置"
          />

          <label class="field-label" for="baseUrlInput">接口地址 <span class="optional">（可选）</span></label>
          <input
            id="baseUrlInput"
            class="field-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="留空使用默认地址"
          />

          <button id="saveProviderButton" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
            保存并获取模型
          </button>

          <label class="field-label" for="modelSelect">模型</label>
          <select id="modelSelect"></select>
        </section>

        <section class="panel knowledge-panel" aria-labelledby="knowledgeTitle">
          <div class="panel-title">
            <div>
              <span id="knowledgeTitle">知识库</span>
              <small id="knowledgePath">knowledge/</small>
            </div>
            <button id="refreshKnowledge" class="icon-button" type="button" title="刷新知识库" aria-label="刷新知识库">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 0 1-15.4 6.4M3 12A9 9 0 0 1 18.4 5.6" />
                <path d="M21 4v6h-6M3 20v-6h6" />
              </svg>
            </button>
          </div>

          <div class="stat-grid" aria-label="知识库统计">
            <div>
              <span>文件</span>
              <strong id="fileCount">0</strong>
            </div>
            <div>
              <span>片段</span>
              <strong id="chunkCount">-</strong>
            </div>
          </div>

          <div id="knowledgeList" class="knowledge-list"></div>

          <button id="uploadButton" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="m17 8-5-5-5 5M12 3v12" />
            </svg>
            上传文档
          </button>
          <input id="fileInput" type="file" accept=".md,.txt,.pdf,.docx" hidden />

          <button id="reindexButton" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
            重建索引
          </button>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Ask your documents</p>
            <h2>向知识库提问</h2>
          </div>
          <div class="topbar-actions">
            <span id="engineState" class="status-pill">索引待加载</span>
            <select id="sessionSelect" class="session-select" title="历史会话" aria-label="历史会话">
              <option value="">当前对话</option>
            </select>
            <button id="clearButton" class="secondary-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              新对话
            </button>
            <button id="themeToggle" class="icon-button" type="button" title="切换深浅模式" aria-label="切换深浅模式">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
          </div>
        </header>

        <section class="chat-frame" aria-label="对话区">
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
        </section>

        <form id="chatForm" class="composer">
          <div class="composer-field">
            <textarea
              id="questionInput"
              rows="1"
              placeholder="输入问题，基于知识库文档获得带引用的回答…"
              required
            ></textarea>
            <button id="sendButton" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m22 2-7 20-4-9-9-4 20-7Z" />
                <path d="M22 2 11 13" />
              </svg>
              发送
            </button>
          </div>
          <div class="composer-hint">
            <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 快速发送</span>
            <span>回答由 AI 基于知识库生成，请核对引用来源</span>
          </div>
        </form>
      </main>

      <aside class="sources-panel" aria-labelledby="sourcesTitle">
        <div class="panel-title">
          <div>
            <span id="sourcesTitle">引用来源</span>
            <small id="sourcesCount">等待回答</small>
          </div>
        </div>
        <div id="sourceList" class="source-list empty">回答后会显示检索到的文档片段。</div>
      </aside>
    </div>

    <div id="dropOverlay" class="drop-overlay" hidden>
      <div class="drop-card">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="m17 8-5-5-5 5M12 3v12" />
        </svg>
        松开以上传到知识库
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
